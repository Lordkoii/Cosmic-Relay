name: Bug Report
description: Report something that is broken or behaving unexpectedly in Cosmic Relay.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Cosmic Relay. Please include enough detail for the issue to be reproduced.

        For media-detection or playback-control problems, **Copy Diagnostics** from Cosmic Relay Settings is especially helpful. Review diagnostics before posting because they can include the current track title, artist, and raw Windows media-session identifier.
  - type: input
    id: version
    attributes:
      label: Cosmic Relay version
      description: Example: v0.7.0-alpha.4
      placeholder: v0.7.0-alpha.4
    validations:
      required: true
  - type: dropdown
    id: media_mode
    attributes:
      label: Media source mode
      options:
        - AUTO
        - SPOT
        - WEB
        - Pinned media session
        - Other / Not sure
    validations:
      required: true
  - type: input
    id: media_source
    attributes:
      label: Media source / player
      description: Example: Spotify, YouTube in Firefox, YouTube in Chrome, Apple Music, etc.
      placeholder: Spotify
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Cosmic Relay
        2. Start playback in ...
        3. Set Media Session / source mode to ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Cosmic Relay diagnostics
      description: Paste Copy Diagnostics output here when relevant. Review it first because it may include track title, artist, and the raw Windows media-session identifier.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Windows version, monitor setup, browser/player version, or anything else that may matter.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / additional context
      description: Drag screenshots here or add any other useful details.
